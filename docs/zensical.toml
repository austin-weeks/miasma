[project]
site_url = "https://austin-weeks.github.io/miasma"
site_name = "Miasma"
site_description = "Trap AI web scrapers in an endless poison pit."
site_author = "Austin Weeks"

copyright = "Copyright &copy; 2026 Austin Weeks"

repo_url = "https://github.com/austin-weeks/miasma"
repo_name = "austin-weeks/miasma"

docs_dir = "content"
edit_uri = "blob/main/docs/pages" # 'blob' rather than 'edit' since users need to fork the repo

# nav = [
#   { "Get started" = "index.md" },
#   { "Markdown in 5min" = "markdown.md" },
# ]

[project.theme]
favicon = "images/logo.png"
logo = "images/logo.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs", # MAYBE turn this off later when we get multiple pages
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate", # MAYBE turn off depending on how much total content we have
]


[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/notebook-pen"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "blue grey"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "blue grey"
accent = "blue"

[[project.extra.social]]
name = "Docker Image"
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/austinweeks/miasma"
[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/miasma"
[[project.extra.social]]
name = "GitHub Repository"
icon = "fontawesome/brands/github"
link = "https://github.com/austin-weeks/miasma"


[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
